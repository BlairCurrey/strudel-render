name: publish

# Publishes to npm when a version tag is pushed:
#   npm version patch && git push --follow-tags
#
# Authenticates with npm's trusted publishing (OIDC): no token is stored
# anywhere. npmjs.com must list this repository and this file name under
# the package's Settings → Trusted Publisher.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # for trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match package.json version $version"; exit 1
          fi
      # trusted publishing needs npm 11.5.1 or newer
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish
